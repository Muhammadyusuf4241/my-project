<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zamonaviy Kalkulyator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="calculator-wrapper">
    <div class="calculator">
      <div class="calculator-header">
        <span class="app-title">Kalkulyator</span>
        <button id="theme-toggle" class="theme-toggle" aria-label="Mavzuni o'zgartirish" title="Mavzuni almashtirish">
          <span class="theme-icon">🌙</span>
        </button>
      </div>

      <div class="display">
        <div class="previous-operand" id="previous-operand"></div>
        <div class="current-operand" id="current-operand">0</div>
      </div>

      <div class="buttons-grid">
        <button class="btn btn-function" data-action="clear" title="Tozalash (Esc)">AC</button>
        <button class="btn btn-function" data-action="delete" title="O'chirish (Backspace)">DEL</button>
        <button class="btn btn-function" data-action="percent" title="Foiz (%)">%</button>
        <button class="btn btn-operator" data-operator="÷" title="Bo'lish (/)">÷</button>

        <button class="btn btn-number" data-number="7">7</button>
        <button class="btn btn-number" data-number="8">8</button>
        <button class="btn btn-number" data-number="9">9</button>
        <button class="btn btn-operator" data-operator="×" title="Ko'paytirish (*)">×</button>

        <button class="btn btn-number" data-number="4">4</button>
        <button class="btn btn-number" data-number="5">5</button>
        <button class="btn btn-number" data-number="6">6</button>
        <button class="btn btn-operator" data-operator="−" title="Ayirish (-)">−</button>

        <button class="btn btn-number" data-number="1">1</button>
        <button class="btn btn-number" data-number="2">2</button>
        <button class="btn btn-number" data-number="3">3</button>
        <button class="btn btn-operator" data-operator="+" title="Qo'shish (+)">+</button>

        <button class="btn btn-function" data-action="negate" title="Ishorani o'zgartirish (±)">±</button>
        <button class="btn btn-number" data-number="0">0</button>
        <button class="btn btn-number" data-action="decimal">.</button>
        <button class="btn btn-equals" data-action="equals" title="Teng (Enter)">=</button>
      </div>

      <div class="calculator-footer">
        <p>Klaviatura yordamida ham foydalanish mumkin</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
